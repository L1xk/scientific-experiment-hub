name: Skill validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Python ${{ matrix.python-version }} smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install core dependency
        run: python -m pip install -r scripts/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q scripts
      - name: Load CLI
        run: python scripts/hub.py --help
      - name: Generate bundled templates
        run: python scripts/hub.py create-templates --output "$RUNNER_TEMP/templates"
      - name: Initialize an isolated data center
        run: python scripts/hub.py init --project "$RUNNER_TEMP/data-center"
